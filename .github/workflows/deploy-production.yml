name: Deploy Work of Art Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workofart-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install HTML audit dependency
        run: python3 -m pip install --quiet beautifulsoup4

      - name: Generate deployable files from main
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          for code in Path('.').rglob('code.html'):
              if '.git' in code.parts or '.github' in code.parts or 'skipped_upload_build' in code.parts:
                  continue
              shutil.copy2(code, code.with_name('index.html'))

          mappings = {
              Path('artists_build/katelyn-cole.html'): Path('artists/katelyn-cole/index.html'),
              Path('artists_build/joshua-cole.html'): Path('artists/joshua-cole/index.html'),
              Path('artists_build/teralyn.html'): Path('artists/teralyn/index.html'),
          }
          for src, dst in mappings.items():
              if src.is_file():
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)

          # Never let a thinner home export overwrite the studio banner homepage.
          candidates = [
              Path('code.html'),
              Path('index.html'),
              Path('home_work_of_art_tattoo_piercing/code.html'),
          ]
          home_src = None
          for candidate in candidates:
              if not candidate.is_file():
                  continue
              text = candidate.read_text(encoding='utf-8', errors='replace')
              if '<<<<<<<' in text:
                  raise SystemExit(f'Conflict markers in homepage candidate: {candidate}')
              if 'woa-hero-banner' in text and 'work-of-art-studio-banner-las-vegas' in text:
                  home_src = candidate
                  break
          if home_src is None:
              raise SystemExit('No homepage source with studio banner (woa-hero-banner) found')
          shutil.copy2(home_src, 'index.html')
          print(f'Homepage source: {home_src}')
          PY
          test -s index.html
          grep -q 'woa-hero-banner' index.html
          grep -q 'work-of-art-studio-banner-las-vegas' index.html
          ! grep -q '<<<<<<<' index.html
          test -s CNAME
          printf '' > .nojekyll
          printf '%s\n' "$GITHUB_SHA" > DEPLOYED_MAIN_SHA

      - name: Preserve production-only files and overlay reviewed source
        run: |
          set -euo pipefail
          git config user.name 'WOA Pages Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin gh-pages
          rm -rf /tmp/woa-gh-pages
          git worktree add --detach /tmp/woa-gh-pages origin/gh-pages
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.bundle' \
            --exclude='workofarttattoo-reconciled-*.bundle' \
            ./ /tmp/woa-gh-pages/

      - name: Audit final production tree
        run: |
          cd /tmp/woa-gh-pages
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup

          required = [
              'index.html',
              'appointments/index.html',
              'artists/katelyn-cole/index.html',
              'artists/joshua-cole/index.html',
              'artists/teralyn/index.html',
              'cover-up-tattoos-las-vegas/index.html',
              'merchandise/index.html',
              'privacy-policy/index.html',
              'terms-of-service/index.html',
              'studio-rules/index.html',
              'fine_line_tattoos_las_vegas_master_authority_guide/index.html',
              'best_tattoo_styles_for_sleeves_large_scale_project_hub/index.html',
              'sitemap-static-pages.xml',
              'robots.txt',
              'CNAME',
              'DEPLOYED_MAIN_SHA',
          ]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit('Missing critical production files: ' + ', '.join(missing))

          merch = Path('merchandise/index.html').read_text(encoding='utf-8', errors='replace')
          if 'Merchandise' not in merch and 'Original art' not in merch and 'original art' not in merch:
              raise SystemExit('Merchandise route exists but does not contain expected merchandise content')

          broken = Counter()
          checked = 0
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts or 'skipped_upload_build' in path.parts:
                  continue
              soup = BeautifulSoup(path.read_text(encoding='utf-8', errors='replace'), 'html.parser')
              for a in soup.find_all('a', href=True):
                  href = (a.get('href') or '').strip()
                  if not href.startswith('/') or href.startswith('//'):
                      continue
                  target = urlsplit(href).path
                  if target in ('', '/'):
                      continue
                  checked += 1
                  rel = target.lstrip('/')
                  candidates = [Path(rel), Path(rel) / 'index.html']
                  if not any(c.exists() for c in candidates):
                      broken[target] += 1

          print(f'Audited {checked} root-relative links.')
          for target, count in broken.most_common(80):
              print(f'BROKEN {count:4d} {target}')
          severe = [(u, n) for u, n in broken.items() if n >= 5]
          if severe:
              raise SystemExit('Repeated broken internal links block deployment: ' + ', '.join(f'{u} ({n})' for u,n in sorted(severe)[:30]))
          PY

      - name: Publish audited tree to gh-pages
        run: |
          set -euo pipefail
          cd /tmp/woa-gh-pages
          # Force the deploy marker in the Pages tree right before commit.
          # Prior runs could update index.html while leaving a stale DEPLOYED_MAIN_SHA.
          printf '%s\n' "$GITHUB_SHA" > DEPLOYED_MAIN_SHA
          test -s DEPLOYED_MAIN_SHA
          test "$(tr -d '\n' < DEPLOYED_MAIN_SHA)" = "$GITHUB_SHA"
          grep -q 'woa-hero-banner' index.html
          git add -A
          git add -f DEPLOYED_MAIN_SHA index.html
          if git diff --cached --quiet; then
            echo 'No production changes to publish.'
          else
            git commit -m "Deploy main overlay to GitHub Pages ${GITHUB_SHA::7}"
            git push origin HEAD:gh-pages
          fi

      - name: Verify gh-pages exact source marker and critical routes
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          test "$(git show origin/gh-pages:CNAME)" = 'www.workofarttattoo.com'
          marker="$(git show origin/gh-pages:DEPLOYED_MAIN_SHA | tr -d '\n')"
          echo "gh-pages marker=$marker expected=$GITHUB_SHA"
          test "$marker" = "$GITHUB_SHA"
          git show origin/gh-pages:index.html | grep -q 'woa-hero-banner'
          git show origin/gh-pages:artists/katelyn-cole/index.html | grep -q 'Professional'
          git cat-file -e origin/gh-pages:cover-up-tattoos-las-vegas/index.html
          git show origin/gh-pages:merchandise/index.html | grep -Eiq 'Merchandise|Original art'
          git cat-file -e origin/gh-pages:privacy-policy/index.html
          git cat-file -e origin/gh-pages:terms-of-service/index.html
          git cat-file -e origin/gh-pages:studio-rules/index.html
          git cat-file -e origin/gh-pages:artists/teralyn/index.html
          echo "gh-pages contains exact main marker $GITHUB_SHA"

      - name: Verify active website serves exact deployed main commit
        run: |
          python3 - <<'PY'
          import os, time, urllib.request

          base = 'https://www.workofarttattoo.com'
          expected = os.environ['GITHUB_SHA']
          critical = {
              '/': 'woa-hero-banner',
              '/appointments/': None,
              '/artists/katelyn-cole/': 'Professional',
              '/artists/joshua-cole/': None,
              '/artists/teralyn/': 'Teralyn',
              '/cover-up-tattoos-las-vegas/': None,
              '/merchandise/': 'Merchandise',
              '/privacy-policy/': 'Privacy',
              '/terms-of-service/': 'Terms',
              '/studio-rules/': 'Studio',
              '/fine_line_tattoos_las_vegas_master_authority_guide/': None,
              '/best_tattoo_styles_for_sleeves_large_scale_project_hub/': None,
              '/robots.txt': None,
              '/sitemap-static-pages.xml': None,
          }

          last = []
          for attempt in range(20):
              failures = []
              try:
                  req = urllib.request.Request(base + '/DEPLOYED_MAIN_SHA?x=' + str(time.time()), headers={'User-Agent':'WOA-Deploy-Verifier/4.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      marker = r.read().decode('utf-8', 'replace').strip()
                  if marker != expected:
                      failures.append(f'deploy marker {marker!r} != {expected!r}')
              except Exception as exc:
                  failures.append('deploy marker: ' + repr(exc))

              for path, needle in critical.items():
                  try:
                      req = urllib.request.Request(base + path + '?x=' + str(time.time()), headers={'User-Agent':'WOA-Deploy-Verifier/4.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          body = r.read().decode('utf-8', 'replace')
                          status = r.status
                      if status != 200:
                          failures.append(f'{path} HTTP {status}')
                      if needle and needle.lower() not in body.lower():
                          failures.append(f'{path} missing {needle!r}')
                  except Exception as exc:
                      failures.append(f'{path}: {exc!r}')

              if not failures:
                  print('ACTIVE WEBSITE VERIFIED: exact main commit is live and all critical routes pass.')
                  raise SystemExit(0)
              last = failures
              print(f'Waiting for GitHub Pages propagation ({attempt + 1}/20):')
              for failure in failures:
                  print(' -', failure)
              time.sleep(15)

          raise SystemExit('Production did not verify: ' + '; '.join(last))
          PY
