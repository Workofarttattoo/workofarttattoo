name: Deploy Work of Art Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workofart-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install build dependencies
        run: python3 -m pip install --quiet Pillow beautifulsoup4

      - name: Prepare generated site
        run: python3 prepare_site_deploy.py

      - name: Reapply correct Katelyn piercing galleries
        run: python3 tools/install_katelyn_piercing_photos.py

      - name: Reapply Katelyn human editorial pass
        run: python3 tools/polish_katelyn_profile.py

      - name: Reapply factual consistency guard
        run: python3 tools/a_plus_cleanup.py

      - name: Reapply claims guard
        run: python3 tools/a_plus_claims_cleanup.py

      - name: Verify no banned customer-facing claims remain
        run: |
          bad=0
          for term in 'Master Piercer' 'Master Body Piercer' 'McCarran' '2,400+' 'medical-grade' 'hospital-grade' 'masculine, honest shop talk' 'cabin pressure and dry airplane air change' 'Best Body Piercer in Las Vegas'; do
            if grep -RIn --exclude-dir=.git --exclude-dir=.github --exclude-dir=tools "$term" --include='*.html' --include='*.json' --include='*.md' .; then
              echo "BANNED CUSTOMER-FACING TERM REMAINS: $term"
              bad=1
            fi
          done
          test "$bad" -eq 0

      - name: Generate crawl assets and validate sitemap
        run: python3 submit_google_recrawl.py

      - name: Generate GitHub Pages index files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')
          copied = 0
          for code in root.rglob('code.html'):
              if '.git' in code.parts or '.github' in code.parts or 'skipped_upload_build' in code.parts:
                  continue
              target = code.with_name('index.html')
              shutil.copy2(code, target)
              copied += 1
          print(f'Generated {copied} index.html files from code.html sources')
          PY
          test -s index.html
          test -s CNAME
          printf '' > .nojekyll

      - name: Publish generated site to gh-pages
        run: |
          set -euo pipefail
          git config user.name 'WOA Pages Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin gh-pages
          rm -rf /tmp/woa-gh-pages
          git worktree add --detach /tmp/woa-gh-pages origin/gh-pages
          find /tmp/woa-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            ./ /tmp/woa-gh-pages/
          cd /tmp/woa-gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo 'No GitHub Pages changes to publish.'
          else
            git commit -m "Deploy main to GitHub Pages ${GITHUB_SHA::7}"
            git push origin HEAD:gh-pages
          fi

      - name: Verify published branch contents
        run: |
          git fetch origin gh-pages
          test "$(git show origin/gh-pages:CNAME)" = 'www.workofarttattoo.com'
          git show origin/gh-pages:index.html | grep -q 'WOA_BUILD_STAMP:'
          git show origin/gh-pages:artists/katelyn-cole/index.html | grep -q 'Professional Piercer'
          echo 'gh-pages branch contains the generated production site.'

      - name: Verify GitHub Pages live
        run: |
          python3 - <<'PY'
          import time, urllib.request
          base='https://www.workofarttattoo.com'
          paths=['/','/artists/katelyn-cole/']
          last=[]
          for attempt in range(12):
              failures=[]
              for path in paths:
                  try:
                      req=urllib.request.Request(base+path+'?deploycheck='+str(int(time.time())), headers={'User-Agent':'WOA-GitHub-Pages-QA/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          body=r.read().decode('utf-8','replace')
                      if path == '/' and 'WOA_BUILD_STAMP:' not in body:
                          failures.append('homepage missing fresh build stamp')
                      if path.endswith('katelyn-cole/') and 'Professional Piercer' not in body:
                          failures.append('Katelyn page missing Professional Piercer')
                  except Exception as exc:
                      failures.append(f'{path}: {exc}')
              if not failures:
                  print('GitHub Pages production verification passed.')
                  raise SystemExit(0)
              last=failures
              print(f'Pages not updated yet (attempt {attempt+1}/12): ' + '; '.join(failures))
              time.sleep(15)
          raise SystemExit('GitHub Pages did not reflect the new build in time: ' + '; '.join(last))
          PY
