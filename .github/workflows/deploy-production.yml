name: Deploy Work of Art Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workofart-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install build dependencies
        run: python3 -m pip install --quiet Pillow beautifulsoup4

      - name: Prepare generated site
        run: python3 prepare_site_deploy.py

      - name: Reapply correct Katelyn piercing galleries
        run: python3 tools/install_katelyn_piercing_photos.py

      - name: Reapply Katelyn human editorial pass
        run: python3 tools/polish_katelyn_profile.py

      - name: Reapply factual consistency guard
        run: python3 tools/a_plus_cleanup.py

      - name: Reapply claims guard
        run: python3 tools/a_plus_claims_cleanup.py

      - name: Verify no banned customer-facing claims remain
        run: |
          bad=0
          for term in 'Master Piercer' 'Master Body Piercer' 'McCarran' '2,400+' 'medical-grade' 'hospital-grade' 'masculine, honest shop talk' 'cabin pressure and dry airplane air change' 'Best Body Piercer in Las Vegas'; do
            if find . \
              -path './.git' -prune -o \
              -path './.github' -prune -o \
              -path './tools' -prune -o \
              -path './audits' -prune -o \
              -name 'a-plus-unresolved.md' -prune -o \
              \( -name '*.html' -o -name '*.json' -o -name '*.md' \) \
              -type f -print0 | xargs -0 grep -In "$term"; then
              echo "BANNED CUSTOMER-FACING TERM REMAINS: $term"
              bad=1
            fi
          done
          test "$bad" -eq 0

      - name: Generate crawl assets and validate sitemap
        run: python3 submit_google_recrawl.py

