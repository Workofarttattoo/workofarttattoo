<script data-woa-booking-inline="1" type="text/javascript">(function(){
var root=document.getElementById("woa-booking-app");if(!root)return;
var tabs=root.querySelectorAll("[data-woa-service-tab]");
var panels=root.querySelectorAll("[data-woa-service-panel]");
function show(s){tabs.forEach(function(b){var on=b.getAttribute("data-woa-service-tab")===s;b.setAttribute("aria-selected",on?"true":"false");b.classList.toggle("bg-secondary",on);b.classList.toggle("text-on-secondary",on);b.classList.toggle("border-secondary",on);b.classList.toggle("text-on-surface-variant",!on);b.classList.toggle("border-outline-variant",!on);});panels.forEach(function(p){var on=p.getAttribute("data-woa-service-panel")===s;p.hidden=!on;p.classList.toggle("hidden",!on);});}
tabs.forEach(function(b){b.addEventListener("click",function(){show(b.getAttribute("data-woa-service-tab"));});});
show("tattoo");
var q=location.search||"";var thanks=document.getElementById("woa-booking-thanks");
if(thanks&&(q.indexOf("sent=tattoo")>=0||q.indexOf("sent=piercing")>=0)){thanks.hidden=false;thanks.classList.remove("hidden");thanks.textContent="Thank you — your request was sent. We will reply shortly.";if(q.indexOf("sent=piercing")>=0)show("piercing");}
})();</script>
