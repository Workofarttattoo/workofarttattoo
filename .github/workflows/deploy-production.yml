name: Deploy Work of Art Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workofart-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require production FTP credentials
        run: |
          test -n "$FTP_USER" || { echo 'Missing GitHub Actions secret: FTP_USER'; exit 2; }
          test -n "$FTP_PASS" || { echo 'Missing GitHub Actions secret: FTP_PASS'; exit 2; }
          echo 'FTP credentials are configured.'

      - name: Install verification dependency
        run: python3 -m pip install --quiet Pillow

      - name: Prepare generated site
        run: python3 prepare_site_deploy.py

      - name: Reapply correct Katelyn piercing galleries
        run: python3 tools/install_katelyn_piercing_photos.py

      - name: Reapply Katelyn human editorial pass
        run: python3 tools/polish_katelyn_profile.py

      - name: Reapply factual consistency guard
        run: python3 tools/a_plus_cleanup.py

      - name: Reapply claims guard
        run: python3 tools/a_plus_claims_cleanup.py

      - name: Verify no banned customer-facing claims remain
        run: |
          bad=0
          for term in 'Master Piercer' 'Master Body Piercer' 'McCarran' '2,400+' 'medical-grade' 'hospital-grade' 'masculine, honest shop talk' 'cabin pressure and dry airplane air change' 'Best Body Piercer in Las Vegas'; do
            if grep -RIn --exclude-dir=.git --exclude-dir=.github --exclude-dir=tools "$term" --include='*.html' --include='*.json' --include='*.md' .; then
              echo "BANNED CUSTOMER-FACING TERM REMAINS: $term"
              bad=1
            fi
          done
          test "$bad" -eq 0

      - name: Generate crawl assets and validate sitemap
        run: python3 submit_google_recrawl.py

      - name: Deploy static site to production FTP
        run: python3 deploy_stitch_site_root.py

      - name: Deploy nested Katelyn piercing portfolio
        run: python3 tools/deploy_katelyn_piercing_portfolio.py

      - name: Verify homepage and core media live
        run: python3 verify_live_deploy.py

      - name: Verify corrected production pages and crawl files
        run: |
          python3 - <<'PY'
          import urllib.request, time
          base='https://www.workofarttattoo.com'
          checks={
            '/artists/katelyn-cole/':(['Professional Piercer','kmorgen14@gmail.com','jim.com/a/katelyn-delano-rose-morg'],['Master Piercer','Master Body Piercer','medical-grade','hospital-grade']),
            '/tattoo_shop_near_the_strip_nap_corrected/':(['Harry Reid International Airport'],['McCarran','480+']),
            '/dermis_skin_science_las_vegas_authority_guide/':([],['Real ear piercing work from our studio','Too shallow (epidermis / upper papillary): blowouts']),
            '/walk_in_tattoos_las_vegas_authority_guide/':(['Hundreds of Google Reviews'],['2,400+']),
          }
          def get(path):
            req=urllib.request.Request(base+path+'?deploycheck='+str(int(time.time())),headers={'User-Agent':'WOA-Production-QA/1.0','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=60) as r:return r.read().decode('utf-8','replace')
          failures=[]
          for path,(must,ban) in checks.items():
            body=get(path)
            for x in must:
              if x not in body: failures.append(f'{path} missing {x!r}')
            for x in ban:
              if x in body: failures.append(f'{path} still contains {x!r}')
          for path in ('/robots.txt','/sitemap-static-pages.xml'):
            body=get(path)
            if not body.strip():failures.append(path+' returned empty content')
          # Verify at least representative nested images are live.
          for name in ('katelyn-helix-piercing-02.webp','katelyn-nostril-piercing-05.webp','katelyn-navel-piercing-02.webp'):
            url=base+'/artists/katelyn-cole/piercing-portfolio/'+name+'?deploycheck='+str(int(time.time()))
            with urllib.request.urlopen(url,timeout=60) as r:
              if r.status!=200 or len(r.read())<10000:failures.append(name+' not correctly served')
          if failures:
            print('\n'.join('FAIL: '+x for x in failures))
            raise SystemExit(1)
          print('Production content, crawl files, and representative piercing images verified.')
          PY
