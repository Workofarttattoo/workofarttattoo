name: Deploy Work of Art Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workofart-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install HTML audit dependency
        run: python3 -m pip install --quiet beautifulsoup4

      - name: Remove dead merchandise links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          changed = 0
          removed = 0
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts or '.github' in path.parts:
                  continue
              raw = path.read_text(encoding='utf-8', errors='replace')
              if '/merchandise/' not in raw:
                  continue
              soup = BeautifulSoup(raw, 'html.parser')
              n = 0
              for a in list(soup.find_all('a', href=True)):
                  href = (a.get('href') or '').strip()
                  if href.rstrip('/') == '/merchandise':
                      a.decompose()
                      n += 1
              if n:
                  path.write_text(str(soup), encoding='utf-8')
                  changed += 1
                  removed += n
          print(f'Removed {removed} dead merchandise links from {changed} HTML files.')
          PY

      - name: Generate GitHub Pages index files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')
          copied = 0
          for code in root.rglob('code.html'):
              if '.git' in code.parts or '.github' in code.parts or 'skipped_upload_build' in code.parts:
                  continue
              target = code.with_name('index.html')
              shutil.copy2(code, target)
              copied += 1
          print(f'Generated {copied} index.html files from code.html sources')
          PY
          test -s index.html
          test -s CNAME
          printf '' > .nojekyll
          printf '%s\n' "$GITHUB_SHA" > DEPLOYED_MAIN_SHA

      - name: Audit critical production files and links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          from collections import Counter
          from urllib.parse import urlsplit

          required = [
              'index.html',
              'appointments/index.html',
              'artists/katelyn-cole/index.html',
              'cover-up-tattoos-las-vegas/index.html',
              'fine_line_tattoos_las_vegas_master_authority_guide/index.html',
              'best_tattoo_styles_for_sleeves_large_scale_project_hub/index.html',
              'sitemap-static-pages.xml',
              'robots.txt',
              'CNAME',
              'DEPLOYED_MAIN_SHA',
          ]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit('Missing critical production files: ' + ', '.join(missing))

          # Merchandise has no page in this repository. No public HTML may link to it.
          merch_refs = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts or '.github' in path.parts:
                  continue
              txt = path.read_text(encoding='utf-8', errors='replace')
              if '/merchandise/' in txt:
                  merch_refs.append(str(path))
          if merch_refs:
              raise SystemExit('Dead /merchandise/ links remain in: ' + ', '.join(merch_refs[:20]))

          # Report root-relative targets that are referenced repeatedly but absent.
          broken = Counter()
          checked = 0
          for path in Path('.').rglob('index.html'):
              if '.git' in path.parts or '.github' in path.parts or 'skipped_upload_build' in path.parts:
                  continue
              soup = BeautifulSoup(path.read_text(encoding='utf-8', errors='replace'), 'html.parser')
              for a in soup.find_all('a', href=True):
                  href = (a.get('href') or '').strip()
                  if not href.startswith('/') or href.startswith('//'):
                      continue
                  target = urlsplit(href).path
                  if target in ('', '/'):
                      continue
                  checked += 1
                  rel = target.lstrip('/')
                  candidates = [Path(rel)]
                  if target.endswith('/'):
                      candidates.append(Path(rel) / 'index.html')
                  else:
                      candidates.append(Path(rel) / 'index.html')
                  if not any(c.exists() for c in candidates):
                      broken[target] += 1
          repeated = [(u, n) for u, n in broken.most_common() if n >= 3]
          if repeated:
              print('WARNING: repeatedly referenced root-relative targets not found in generated site:')
              for u, n in repeated[:40]:
                  print(f'  {n:4d}  {u}')
          print(f'Audited {checked} root-relative links. Critical production files are present.')
          PY

      - name: Publish generated site to gh-pages
        run: |
          set -euo pipefail
          git config user.name 'WOA Pages Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin gh-pages
          rm -rf /tmp/woa-gh-pages
          git worktree add --detach /tmp/woa-gh-pages origin/gh-pages
          find /tmp/woa-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            ./ /tmp/woa-gh-pages/
          cd /tmp/woa-gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo 'No GitHub Pages changes to publish.'
          else
            git commit -m "Deploy main to GitHub Pages ${GITHUB_SHA::7}"
            git push origin HEAD:gh-pages
          fi

      - name: Verify gh-pages exactly identifies deployed main
        run: |
          git fetch origin gh-pages
          test "$(git show origin/gh-pages:CNAME)" = 'www.workofarttattoo.com'
          test "$(git show origin/gh-pages:DEPLOYED_MAIN_SHA)" = "$GITHUB_SHA"
          git show origin/gh-pages:artists/katelyn-cole/index.html | grep -q 'Professional Piercer'
          ! git grep -n '/merchandise/' origin/gh-pages -- '*.html'
          echo "gh-pages identifies deployed main as $GITHUB_SHA"

      - name: Verify active website serves this exact main commit
        run: |
          python3 - <<'PY'
          import os, time, urllib.request

          base='https://www.workofarttattoo.com'
          expected=os.environ['GITHUB_SHA']
          critical={
              '/': None,
              '/appointments/': None,
              '/artists/katelyn-cole/': 'Professional Piercer',
              '/cover-up-tattoos-las-vegas/': 'Cover Up Tattoos Las Vegas',
              '/fine_line_tattoos_las_vegas_master_authority_guide/': None,
              '/best_tattoo_styles_for_sleeves_large_scale_project_hub/': None,
          }
          last=[]
          for attempt in range(16):
              failures=[]
              try:
                  req=urllib.request.Request(base+'/DEPLOYED_MAIN_SHA?x='+str(time.time()), headers={'User-Agent':'WOA-Deploy-Verifier/2.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      marker=r.read().decode('utf-8','replace').strip()
                  if marker != expected:
                      failures.append(f'deploy marker is {marker!r}, expected {expected!r}')
              except Exception as exc:
                  failures.append('deploy marker: '+repr(exc))

              for path, needle in critical.items():
                  try:
                      req=urllib.request.Request(base+path+'?x='+str(time.time()), headers={'User-Agent':'WOA-Deploy-Verifier/2.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          body=r.read().decode('utf-8','replace')
                          if r.status != 200:
                              failures.append(f'{path} HTTP {r.status}')
                      if needle and needle not in body:
                          failures.append(f'{path} missing {needle!r}')
                      if '/merchandise/' in body:
                          failures.append(f'{path} still contains dead merchandise link')
                  except Exception as exc:
                      failures.append(f'{path}: {exc!r}')

              if not failures:
                  print('ACTIVE WEBSITE VERIFIED: exact main commit is live and critical pages pass.')
                  raise SystemExit(0)
              last=failures
              print(f'Waiting for GitHub Pages propagation ({attempt+1}/16):')
              for f in failures:
                  print(' -', f)
              time.sleep(15)
          raise SystemExit('Production did not verify: ' + '; '.join(last))
          PY
